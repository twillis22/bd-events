name: Update BD Events

on:
  schedule:
    # Runs daily at 13:00 UTC = 06:00 PT
    - cron: '0 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scrapers/**'
      - 'aggregate.py'
      - 'main.py'
      - 'generate_*.py'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        # --with-deps installs system libraries Chromium needs on Ubuntu.
        # Cached between runs by GitHub's actions cache via the OS image.
        run: python -m playwright install chromium --with-deps

      - name: Run aggregator
        run: python main.py

      - name: Commit updated outputs
        run: |
          git config user.name  "bd-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/events.ics docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update events ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
