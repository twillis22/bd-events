name: Update BD Events

on:
  schedule:
    # Daily at 13:00 UTC = 06:00 PT
    - cron: '0 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scrapers/**'
      - 'aggregate.py'
      - 'main.py'
      - 'generate_*.py'
      - 'seen_tracker.py'
      - 'requirements.txt'

permissions:
  contents: write

# Serialize runs: a push-triggered run and the daily cron (or a manual
# dispatch) can otherwise race, and the loser's git push gets rejected.
concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Verify Playwright install
        run: |
          python -c "from playwright.sync_api import sync_playwright; \
                     p = sync_playwright().start(); \
                     b = p.chromium.launch(); \
                     print('Chromium OK'); \
                     b.close(); p.stop()"

      - name: Run aggregator
        run: python main.py

      - name: Commit updated outputs
        run: |
          git config user.name  "bd-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/events.ics docs/index.html data/seen.json data/archive.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update events ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
